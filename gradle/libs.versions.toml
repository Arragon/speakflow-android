[versions]
agp                  = "8.6.0"
kotlin               = "2.0.21"
ksp                  = "2.0.21-1.0.28"
hilt                = "2.52"
composeBom           = "2024.10.01"
coreKtx              = "1.13.1"
appcompat            = "1.7.0"
material             = "1.12.0"
activityCompose      = "1.9.3"
lifecycle            = "2.8.5"
media3               = "1.4.1"
room                 = "2.6.1"
navigationCompose    = "2.8.2"
hiltNavCompose       = "1.2.0"
retrofit             = "2.11.0"
okhttp               = "4.12.0"
coroutines           = "1.9.0"
datastore            = "1.1.1"
ffmpegKit            = "6.0-2"

[plugins]
android-application  = { id = "com.android.application", version.ref = "agp" }
android-library      = { id = "com.android.library", version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                  = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt                = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

[libraries]
core-ktx                 = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
appcompat                = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material                 = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity-compose         = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

lifecycle-runtime-ktx    = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx  = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose= { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

compose-bom              = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui               = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics      = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling       = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3        = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-foundation       = { group = "androidx.compose.foundation", name = "foundation" }
compose-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout" }
compose-runtime          = { group = "androidx.compose.runtime", name = "runtime" }

navigation-compose       = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
hilt-navigation-compose  = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavCompose" }

media3-exoplayer        = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui               = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-common           = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
media3-session          = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }

room-runtime            = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx                = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler           = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

hilt-android            = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler           = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }

retrofit                = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-json   = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp                  = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging          = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version = "1.7.3" }

coroutines-android      = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

datastore               = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

ffmpeg-kit-full         = { group = "com.arthenica", name = "ffmpeg-kit-full", version.ref = "ffmpegKit" }
